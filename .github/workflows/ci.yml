name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push cancels the previous run of the same pull request. Runs on main are never
# cancelled: each one publishes the images of its own commit, and the changed files are
# computed per push, so a cancelled run would lose its images for good.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint and formatting: same script as the local pre-commit hook, so what passes locally
  # passes here.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Lint and formatting
        run: sh scripts/check.sh

  # Detects which component jobs need to run. Pull requests require pull-requests: read
  # so paths-filter can query the changed files.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      back: ${{ steps.filter.outputs.back }}
      ml: ${{ steps.filter.outputs.ml }}
      front: ${{ steps.filter.outputs.front }}
      perf: ${{ steps.filter.outputs.perf }}
      deploy: ${{ steps.filter.outputs.deploy }}
      shared: ${{ steps.filter.outputs.shared }}
      sonar_back_enabled: ${{ steps.sonar-config.outputs.back }}
      sonar_ml_enabled: ${{ steps.sonar-config.outputs.ml }}
      sonar_front_enabled: ${{ steps.sonar-config.outputs.front }}
    steps:
      - name: Check Sonar configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          PROJECT_KEY_BACK: ${{ vars.SONAR_PROJECT_KEY_BACK }}
          PROJECT_KEY_ML: ${{ vars.SONAR_PROJECT_KEY_ML }}
          PROJECT_KEY_FRONT: ${{ vars.SONAR_PROJECT_KEY_FRONT }}
        run: |
          for component in back ml front; do
            variable="PROJECT_KEY_${component^^}"
            missing=()
            [ -n "$SONAR_TOKEN" ] || missing+=(SONAR_TOKEN)
            [ -n "$SONAR_ORGANIZATION" ] || missing+=(SONAR_ORGANIZATION)
            [ -n "${!variable}" ] || missing+=("SONAR_PROJECT_KEY_${component^^}")
            if (( ${#missing[@]} == 0 )); then
              echo "$component=true" >> "$GITHUB_OUTPUT"
            else
              echo "$component=false" >> "$GITHUB_OUTPUT"
              echo "::notice::SonarQube ($component) skipped, missing: ${missing[*]}."
            fi
          done

      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # act events can omit repository.default_branch; this workflow targets main.
          base: ${{ env.ACT == 'true' && 'HEAD' || github.event.repository.default_branch || 'main' }}
          filters: |
            back:
              - 'app/back/**'
              - 'db/**'
              - 'pyproject.toml'
            ml:
              - 'ml/src/**'
              - 'ml/tests/**'
              - 'ml/scripts/**'
              - 'ml/Dockerfile.predict'
              - 'ml/Dockerfile.train'
              - 'ml/data/processed/readings_hourly_20250101_20260701.parquet'
              - 'ml/pyproject.toml'
              - 'ml/Dockerfile'
              - 'ml/.dockerignore'
              - 'pyproject.toml'
            front:
              - 'app/front/**'
            # Touching the CI itself runs every job, so a workflow change is always tested.
            shared:
              - '.github/workflows/ci.yml'
              - 'sonar-project.properties'
            perf:
              - '.github/workflows/ci.yml'
              - 'app/back/**'
              - 'db/**'
              - 'ml/src/**'
              - 'ml/pyproject.toml'
              - 'ml/Dockerfile'
              - 'ml/Dockerfile.mlflow'
              - 'ml/Dockerfile.predict'
              - 'ml/Dockerfile.train'
              - 'ml/data/processed/**'
              - 'docker-compose*.yml'
              - 'ml/scripts/**'
              - 'tests/perf/**'
              - 'app/front/**'
            deploy:
              - '.github/workflows/ci.yml'
              - 'app/back/**'
              - 'db/**'
              - 'ml/src/**'
              - 'ml/pyproject.toml'
              - 'ml/Dockerfile'
              - 'ml/Dockerfile.mlflow'
              - 'ml/Dockerfile.predict'
              - 'ml/Dockerfile.train'
              - 'ml/data/processed/**'
              - 'ml/scripts/train.py'
              - 'docker-compose.yml'
              - 'docker-compose.deploy.yml'
              - 'app/front/**'

  # Back-end tests against a real PostgreSQL database. Coverage scope and 80 % threshold:
  # app/back/pyproject.toml.
  tests-back:
    needs: changes
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.back == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enervision
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: enervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enervision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enervision:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/enervision
      # Tests marked `db` fail instead of being skipped when the database is missing.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: app/back
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: app/back/pyproject.toml
          cache: pip
          cache-dependency-path: app/back/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Back-end coverage"
            python -m coverage report --format=markdown --fail-under=0 || echo "No coverage data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-coverage
          path: |
            app/back/coverage.xml
            app/back/htmlcov/
          retention-days: 14

  # ML service tests. Coverage scope and 80 % threshold: ml/pyproject.toml.
  tests-ml:
    needs: changes
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: ml/pyproject.toml
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### ML coverage"
            python -m coverage report --format=markdown --fail-under=0 || echo "No coverage data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ml-coverage
          path: |
            ml/coverage.xml
            ml/htmlcov/
          retention-days: 14

  # Repository scan: vulnerable dependencies, misconfigurations, committed secrets.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

  # Front end: type-check, production build and unit tests. Coverage scope and 80 %
  # threshold on the TypeScript logic: app/front/vitest.config.ts.
  tests-front:
    needs: changes
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    env:
      # The dashboard shows Paris time, while GitHub runners use UTC.
      TZ: Europe/Paris
    defaults:
      run:
        working-directory: app/front
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/front/.nvmrc
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Front-end coverage"
            echo '```'
            cat coverage/coverage.txt || echo "No coverage data."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: front-coverage
          path: app/front/coverage/
          retention-days: 14

  # Each SonarCloud monorepo project is analyzed only when its component changes.
  # The component test job supplies its matching coverage report.
  sonar-back:
    needs: [changes, tests-back]
    timeout-minutes: 30
    if: >-
      !cancelled() &&
      needs.changes.outputs.sonar_back_enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.back == 'true') &&
      needs.tests-back.result == 'success'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: back-coverage
          path: app/back

      - name: Make back-end coverage paths relative to the repository root
        run: |
          sed -i \
            -e 's#filename="#filename="app/back/#g' \
            -e "s#<source>[^<]*</source>#<source>$GITHUB_WORKSPACE</source>#" \
            app/back/coverage.xml
          missing=0
          while read -r path; do
            if [ ! -f "$path" ]; then
              echo "Coverage path not found in the repository: $path" >&2
              missing=1
            fi
          done < <(grep -o 'filename="[^"]*"' app/back/coverage.xml | cut -d'"' -f2)
          exit "$missing"

      - name: SonarQube Cloud scan (back)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACK }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.inclusions=app/back/src/**
            -Dsonar.test.inclusions=app/back/tests/**
            -Dsonar.python.coverage.reportPaths=app/back/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=
            -Dsonar.coverage.exclusions=**/__init__.py
            -Dsonar.qualitygate.wait=true

  sonar-ml:
    needs: [changes, tests-ml]
    timeout-minutes: 30
    if: >-
      !cancelled() &&
      needs.changes.outputs.sonar_ml_enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ml == 'true') &&
      needs.tests-ml.result == 'success'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: ml-coverage
          path: ml

      - name: Make ML coverage paths relative to the repository root
        run: |
          sed -i \
            -e 's#filename="#filename="ml/#g' \
            -e "s#<source>[^<]*</source>#<source>$GITHUB_WORKSPACE</source>#" \
            ml/coverage.xml
          missing=0
          while read -r path; do
            if [ ! -f "$path" ]; then
              echo "Coverage path not found in the repository: $path" >&2
              missing=1
            fi
          done < <(grep -o 'filename="[^"]*"' ml/coverage.xml | cut -d'"' -f2)
          exit "$missing"

      - name: SonarQube Cloud scan (ML)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_ML }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.inclusions=ml/src/**
            -Dsonar.test.inclusions=ml/tests/**
            -Dsonar.python.coverage.reportPaths=ml/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=
            -Dsonar.coverage.exclusions=**/__init__.py
            -Dsonar.qualitygate.wait=true

  sonar-front:
    needs: [changes, tests-front]
    timeout-minutes: 30
    if: >-
      !cancelled() &&
      needs.changes.outputs.sonar_front_enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.front == 'true') &&
      needs.tests-front.result == 'success'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: front-coverage
          path: app/front/coverage

      - name: Make front-end coverage paths relative to the repository root
        run: |
          sed -i 's#^SF:#SF:app/front/#' app/front/coverage/lcov.info
          missing=0
          while read -r path; do
            if [ ! -f "$path" ]; then
              echo "Coverage path not found in the repository: $path" >&2
              missing=1
            fi
          done < <(grep '^SF:' app/front/coverage/lcov.info | cut -d: -f2-)
          exit "$missing"

      - name: SonarQube Cloud scan (front)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONT }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.inclusions=app/front/src/**
            -Dsonar.test.inclusions=app/front/src/tests/**
            -Dsonar.python.coverage.reportPaths=
            -Dsonar.javascript.lcov.reportPaths=app/front/coverage/lcov.info
            -Dsonar.coverage.exclusions=app/front/src/main.tsx,app/front/src/App.tsx,app/front/src/vite-env.d.ts,app/front/src/services/model.ts,app/front/src/data/**
            -Dsonar.qualitygate.wait=true

  # Builds and scans each image, then hands it over to the next jobs. The component tests
  # may be skipped (nothing changed there), but never failed.
  #
  # Every job downstream of a skipped one is skipped too, even through a job that runs: a
  # job that needs build, perf or publish must therefore state its own condition with
  # !cancelled() and check the result of the job it needs, not rely on the default success().
  build:
    needs: [changes, lint, scan, tests-back, tests-ml, tests-front]
    timeout-minutes: 45
    if: >-
      !cancelled() &&
      (needs.changes.outputs.perf == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.scan.result == 'success' &&
      (needs.tests-back.result == 'success' || needs.tests-back.result == 'skipped') &&
      (needs.tests-ml.result == 'success' || needs.tests-ml.result == 'skipped') &&
      (needs.tests-front.result == 'success' || needs.tests-front.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            context: app/back
            dockerfile: Dockerfile

          - service: ml
            context: ml
            dockerfile: Dockerfile

          - service: mlflow
            context: ml
            dockerfile: Dockerfile.mlflow

          - service: front
            context: app/front
            dockerfile: Dockerfile

          - service: ml-predict
            context: ml
            dockerfile: Dockerfile.predict

          - service: ml-train
            context: ml
            dockerfile: Dockerfile.train

    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: Export image
        run: docker save "$IMAGE:${{ github.sha }}" -o "/tmp/${{ matrix.service }}.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # Load test against the stack started from the built images. The back reads its data
  # from a local EnerVision stand-in (docker-compose.ci.yml), never from the real API.
  perf:
    needs: [changes, build]
    timeout-minutes: 45
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.changes.outputs.perf == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      BACK_IMAGE: ghcr.io/${{ github.repository }}/back:${{ github.sha }}
      ML_IMAGE: ghcr.io/${{ github.repository }}/ml:${{ github.sha }}
      MLFLOW_IMAGE: ghcr.io/${{ github.repository }}/mlflow:${{ github.sha }}
      ML_PREDICT_IMAGE: ghcr.io/${{ github.repository }}/ml-predict:${{ github.sha }}
      ML_TRAIN_IMAGE: ghcr.io/${{ github.repository }}/ml-train:${{ github.sha }}
      FRONT_IMAGE: ghcr.io/${{ github.repository }}/front:${{ github.sha }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      ML_DB_PASSWORD: ${{ secrets.ML_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for archive in /tmp/images/*.tar; do docker load -i "$archive"; done
          {
            echo "BACK_IMAGE=${BACK_IMAGE,,}"
            echo "ML_IMAGE=${ML_IMAGE,,}"
            echo "MLFLOW_IMAGE=${MLFLOW_IMAGE,,}"
            echo "ML_PREDICT_IMAGE=${ML_PREDICT_IMAGE,,}"
            echo "ML_TRAIN_IMAGE=${ML_TRAIN_IMAGE,,}"
            echo "FRONT_IMAGE=${FRONT_IMAGE,,}"
          } >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait for services
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8001/health
          # The back answers /health before it reaches the database and before its first
          # refresh: also wait for the database and for the consumption data.
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"database":"ok"' &&
              curl --fail --silent --output /dev/null http://localhost:8000/api/consommations; then
              exit 0
            fi
            sleep 2
          done
          echo "The back did not reach the database or load consumption data in time" >&2
          exit 1

      - name: Run load test (k6)
        run: |
          mkdir -p perf-results
          docker run --rm --network host \
            -v "$PWD/tests/perf:/scripts:ro" \
            -v "$PWD/perf-results:/results" \
            --user "$(id -u)" \
            grafana/k6:2.3.0 run /scripts/load.js --summary-export=/results/k6-summary.json

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: perf-results/
          retention-days: 14

  # Publishes the complete runtime image set to GHCR after a deployable change on main, once
  # every other job of the run has passed, Sonar included: a published image set is always a
  # validated version, and the deploy workflow deploys the newest one.
  publish:
    needs: [changes, perf, sonar-back, sonar-ml, sonar-front]
    timeout-minutes: 15
    if: >-
      !cancelled() &&
      needs.perf.result == 'success' &&
      (needs.sonar-back.result == 'success' || needs.sonar-back.result == 'skipped') &&
      (needs.sonar-ml.result == 'success' || needs.sonar-ml.result == 'skipped') &&
      (needs.sonar-front.result == 'success' || needs.sonar-front.result == 'skipped') &&
      needs.changes.outputs.deploy == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [back, ml, mlflow, ml-predict, ml-train, front]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
          path: /tmp/images

      - name: Load image
        run: |
          docker load -i "/tmp/images/${{ matrix.service }}.tar"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"
