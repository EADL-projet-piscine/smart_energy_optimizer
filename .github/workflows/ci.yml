name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push cancels the previous run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and formatting: same script as the local pre-commit hook, so what passes locally
  # passes here.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint and formatting
        run: sh scripts/check.sh

  # Back-end tests against a real PostgreSQL database. Coverage scope and 80 % threshold:
  # app/back/pyproject.toml.
  tests-back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enervision
          POSTGRES_PASSWORD: enervision
          POSTGRES_DB: enervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enervision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enervision:enervision@localhost:5432/enervision
      # Tests marked `db` fail instead of being skipped when the database is missing.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: app/back
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: app/back/pyproject.toml
          cache: pip
          cache-dependency-path: app/back/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Back-end coverage"
            python -m coverage report --format=markdown --fail-under=0 || echo "No coverage data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-coverage
          path: |
            app/back/coverage.xml
            app/back/htmlcov/
          retention-days: 14

  # ML service tests. Coverage scope and 80 % threshold: ml/pyproject.toml.
  tests-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: ml/pyproject.toml
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### ML coverage"
            python -m coverage report --format=markdown --fail-under=0 || echo "No coverage data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ml-coverage
          path: |
            ml/coverage.xml
            ml/htmlcov/
          retention-days: 14

  # Repository scan: vulnerable dependencies, misconfigurations, committed secrets.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

  # Front end: type-check, production build and unit tests. Coverage scope and 80 %
  # threshold on the TypeScript logic: app/front/vitest.config.ts.
  tests-front:
    runs-on: ubuntu-latest
    env:
      # The dashboard shows Paris time, while GitHub runners use UTC.
      TZ: Europe/Paris
    defaults:
      run:
        working-directory: app/front
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/front/.nvmrc
          cache: npm
          cache-dependency-path: app/front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Front-end coverage"
            echo '```'
            cat coverage/coverage.txt || echo "No coverage data."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: front-coverage
          path: app/front/coverage/
          retention-days: 14

  # SonarQube analysis (Cloud by default, Server with the SONAR_HOST_URL variable) of the
  # three projects, with the coverage reports of the tests-* jobs. Scope and exclusions:
  # sonar-project.properties. The job is skipped until the SONAR_TOKEN secret and the
  # SONAR_PROJECT_KEY variable exist, and on pull requests from forks, which have no secret.
  sonar:
    needs: [tests-back, tests-ml, tests-front]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # SonarQube needs the whole history to blame lines and to tell what is new code.
          fetch-depth: 0

      - name: Check configuration
        id: config
        env:
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$PROJECT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube skipped: set the SONAR_TOKEN secret and the SONAR_PROJECT_KEY variable."
          fi

      - name: Download back-end coverage
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: back-coverage
          path: app/back

      - name: Download ML coverage
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ml-coverage
          path: ml

      - name: Download front-end coverage
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: front-coverage
          path: app/front/coverage

      # coverage.py and Vitest write paths relative to the project they ran in, while
      # SonarQube resolves them from the repository root. Without this step it would find no
      # file and report 0 % coverage without any error, so the job fails if a path is unknown.
      - name: Make coverage paths relative to the repository root
        if: steps.config.outputs.enabled == 'true'
        run: |
          prefix_xml() {
            sed -i \
              -e "s#filename=\"#filename=\"$2/#g" \
              -e "s#<source>[^<]*</source>#<source>$GITHUB_WORKSPACE</source>#" \
              "$1"
          }
          prefix_xml app/back/coverage.xml app/back
          prefix_xml ml/coverage.xml ml
          sed -i 's#^SF:#SF:app/front/#' app/front/coverage/lcov.info

          missing=0
          while read -r path; do
            if [ ! -f "$path" ]; then
              echo "Coverage path not found in the repository: $path" >&2
              missing=1
            fi
          done < <(
            grep -h -o 'filename="[^"]*"' app/back/coverage.xml ml/coverage.xml | cut -d'"' -f2
            grep -h '^SF:' app/front/coverage/lcov.info | cut -d: -f2-
          )
          exit "$missing"

      # The quality gate decides the result: the job fails when the gate is red.
      - name: SonarQube scan
        if: steps.config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

      # TEMPORARY: prints what makes the quality gate of main fail, with file and line. It
      # cannot fail the job, and is removed once the alerts are fixed.
      - name: Sonar diagnostics
        if: always() && steps.config.outputs.enabled == 'true'
        continue-on-error: true
        env:
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          HOST: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          api() { curl --fail --silent --show-error --user "$SONAR_TOKEN:" "$HOST/api/$1"; }
          echo "== Failing quality gate conditions (main)"
          api "qualitygates/project_status?projectKey=$PROJECT_KEY&branch=main" |
            jq -r '.projectStatus.conditions[] | select(.status != "OK") | "\(.metricKey): \(.actualValue) (threshold \(.errorThreshold))"'
          echo "== Open vulnerabilities (main)"
          api "issues/search?componentKeys=$PROJECT_KEY&branch=main&resolved=false&types=VULNERABILITY&ps=200" |
            jq -r '.issues[] | "\(.severity) \(.rule) \(.component | sub("^[^:]*:"; "")):\(.line // 0) \(.message)"'
          echo "== Security hotspots to review (main)"
          api "hotspots/search?projectKey=$PROJECT_KEY&branch=main&status=TO_REVIEW&ps=200" |
            jq -r '.hotspots[] | "\(.vulnerabilityProbability) \(.ruleKey) \(.component | sub("^[^:]*:"; "")):\(.line // 0) \(.message)"'

  # Builds and scans each image, then hands it over to the next jobs.
  build:
    needs: [lint, scan, tests-back, tests-ml, tests-front]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            context: app/back
          - service: ml
            context: ml
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: Export image
        run: docker save "$IMAGE:${{ github.sha }}" -o "/tmp/${{ matrix.service }}.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # Load test against the stack started from the built images. The back reads its data
  # from a local EnerVision stand-in (docker-compose.ci.yml), never from the real API.
  perf:
    needs: build
    runs-on: ubuntu-latest
    env:
      BACK_IMAGE: ghcr.io/${{ github.repository }}/back:${{ github.sha }}
      ML_IMAGE: ghcr.io/${{ github.repository }}/ml:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for archive in /tmp/images/*.tar; do docker load -i "$archive"; done
          echo "BACK_IMAGE=${BACK_IMAGE,,}" >> "$GITHUB_ENV"
          echo "ML_IMAGE=${ML_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait for services
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8001/health
          # The back answers /health before it reaches the database and before its first
          # refresh: also wait for the database and for the consumption data.
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"database":"ok"' &&
              curl --fail --silent --output /dev/null http://localhost:8000/api/consommations; then
              exit 0
            fi
            sleep 2
          done
          echo "The back did not reach the database or load consumption data in time" >&2
          exit 1

      - name: Run load test (k6)
        run: |
          mkdir -p perf-results
          docker run --rm --network host \
            -v "$PWD/tests/perf:/scripts:ro" \
            -v "$PWD/perf-results:/results" \
            --user "$(id -u)" \
            grafana/k6:2.3.0 run /scripts/load.js --summary-export=/results/k6-summary.json

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: perf-results/
          retention-days: 14

  # Publishes to GHCR, from main only, the images that passed every check.
  publish:
    needs: perf
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [back, ml]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
          path: /tmp/images

      - name: Load image
        run: |
          docker load -i "/tmp/images/${{ matrix.service }}.tar"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
