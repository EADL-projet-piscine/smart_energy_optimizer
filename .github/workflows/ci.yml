name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, formatage, tests fonctionnels contre une vraie base, couverture.
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enervision
          POSTGRES_PASSWORD: enervision
          POSTGRES_DB: enervision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enervision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enervision:enervision@localhost:5432/enervision
      # Les tests marqués `db` échouent au lieu d'être ignorés si la base manque.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5

      # Même script que le hook pre-commit local : ce qui passe en local passe ici.
      - name: Lint and formatting
        run: sh scripts/check.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/back/pyproject.toml
            ml/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "./app/back[dev]"

      - name: Install ML
        run: python -m pip install -e "./ml[dev]"


      # Le seuil de couverture est défini dans pyproject.toml (tool.coverage.report).
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

  # Construit et scanne chaque image, puis la transmet aux jobs suivants.
  build:
    needs: [lint, scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            context: app/back
          - service: ml
            context: ml
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: Export image
        run: docker save "$IMAGE:${{ github.sha }}" -o "/tmp/${{ matrix.service }}.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # Test de charge sur la stack lancée avec les images construites.
  perf:
    needs: build
    runs-on: ubuntu-latest
    env:
      BACK_IMAGE: ghcr.io/${{ github.repository }}/back:${{ github.sha }}
      ML_IMAGE: ghcr.io/${{ github.repository }}/ml:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images
        run: |
          for archive in /tmp/images/*.tar; do docker load -i "$archive"; done
          echo "BACK_IMAGE=${BACK_IMAGE,,}" >> "$GITHUB_ENV"
          echo "ML_IMAGE=${ML_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait for services
        run: |
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8001/health
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"database":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "Le back n'a pas atteint la base à temps" >&2
          exit 1

      - name: Run load test (k6)
        run: |
          mkdir -p perf-results
          docker run --rm --network host \
            -v "$PWD/tests/perf:/scripts:ro" \
            -v "$PWD/perf-results:/results" \
            --user "$(id -u)" \
            grafana/k6:2.3.0 run /scripts/health.js --summary-export=/results/k6-summary.json

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: perf-results/
          retention-days: 14

  # Publie sur GHCR, depuis main uniquement, les images qui ont passé tous les contrôles.
  publish:
    needs: perf
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [back, ml]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
          path: /tmp/images

      - name: Load image
        run: |
          docker load -i "/tmp/images/${{ matrix.service }}.tar"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
