name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: self-hosted

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v5
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          export BACK_IMAGE="${IMAGE_PREFIX}/back:${IMAGE_TAG}"
          export ML_IMAGE="${IMAGE_PREFIX}/ml:${IMAGE_TAG}"
          export MLFLOW_IMAGE="${IMAGE_PREFIX}/mlflow:${IMAGE_TAG}"

          PROD_ENV="$HOME/enervision/.env"

          test -f "$PROD_ENV"

          set -a
          source "$PROD_ENV"
          set +a

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            config --quiet

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            pull

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            up -d --no-build --remove-orphans

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            ps
