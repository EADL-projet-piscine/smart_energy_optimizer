name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Chooses the newest commit of main whose complete image set was published, which is not
  # always the commit that triggered this run. CI publishes images only once every check of
  # a deployable commit has passed, so this commit is the newest validated version:
  # re-running an old CI run, or CI runs on main that finish out of order, never put an
  # older version back in production.
  resolve:
    name: Choose the version to deploy
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: self-hosted
    env:
      # Number of commits of main searched for a complete image set.
      SEARCH_DEPTH: 50
    outputs:
      commit: ${{ steps.newest.outputs.commit }}
      deploy: ${{ steps.running.outputs.deploy }}

    steps:
      # In a subfolder: the database mounts db/init and db/migrations from the workspace, so
      # the files of the running version stay in place until a deployment replaces them.
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: main
          path: main-history
          fetch-depth: ${{ env.SEARCH_DEPTH }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the newest complete image set
        id: newest
        working-directory: main-history
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # Succeeds when the image exists, fails when the registry does not know it. Any other
          # error stops the job: an authentication failure must not look like a missing image.
          image_exists() {
            local inspection
            if inspection=$(docker manifest inspect "$1" 2>&1); then
              return 0
            fi
            if grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$inspection"; then
              return 1
            fi
            echo "::error::Unable to inspect $1: ${inspection}"
            exit 1
          }

          # The first-parent history lists the commits pushed to main, merge commits included,
          # but not the commits of the merged branches, which never have images.
          for commit in $(git rev-list --first-parent --max-count="$SEARCH_DEPTH" HEAD); do
            complete=true
            for service in back ml ml-predict ml-train mlflow front; do
              if ! image_exists "${IMAGE_PREFIX}/${service}:${commit}"; then
                complete=false
                break
              fi
            done
            if [[ "$complete" == true ]]; then
              echo "Newest complete image set: ${commit}"
              # A manual run is expected to deploy the head of main: say why it does not.
              if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$commit" != "$(git rev-parse HEAD)" ]]; then
                echo "::warning::The head of main ($(git rev-parse HEAD)) has no complete image set: its CI run may still be publishing, or it changes nothing deployable. Deploying ${commit} instead."
              fi
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No complete image set for ${commit}"
          done

          # A manual run asked for a deployment: it must not report success when there is
          # nothing to deploy.
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "::error::No complete image set among the last ${SEARCH_DEPTH} commits of main: if a CI run of main is in progress, wait for its publish job. Nothing was deployed."
            exit 1
          fi
          echo "::notice::No complete image set among the last ${SEARCH_DEPTH} commits of main; nothing to deploy."

      - name: Skip a version that is already running
        id: running
        if: steps.newest.outputs.commit != ''
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT: ${{ steps.newest.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          # A manual run redeploys even a running version, e.g. to apply a change to the
          # .env file of the VM.
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # Compose names the project after the folder of the compose files: the workspace.
          PROJECT=$(basename "$GITHUB_WORKSPACE" | tr '[:upper:]' '[:lower:]')

          running=true
          for service in back ml mlflow front; do
            image=$(docker ps \
              --filter "label=com.docker.compose.project=${PROJECT}" \
              --filter "label=com.docker.compose.service=${service}" \
              --format '{{.Image}}')
            if [[ "$image" != "${IMAGE_PREFIX}/${service}:${COMMIT}" ]]; then
              running=false
            fi
          done

          if [[ "$running" == true ]]; then
            echo "::notice::${COMMIT} is already running; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy application
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: self-hosted
    environment: production
    outputs:
      site-domain: ${{ steps.site.outputs.domain }}

    steps:
      - name: Checkout the version to deploy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ needs.resolve.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          export BACK_IMAGE="${IMAGE_PREFIX}/back:${IMAGE_TAG}"
          export ML_IMAGE="${IMAGE_PREFIX}/ml:${IMAGE_TAG}"
          export ML_PREDICT_IMAGE="${IMAGE_PREFIX}/ml-predict:${IMAGE_TAG}"
          export MLFLOW_IMAGE="${IMAGE_PREFIX}/mlflow:${IMAGE_TAG}"
          export ML_TRAIN_IMAGE="${IMAGE_PREFIX}/ml-train:${IMAGE_TAG}"
          export FRONT_IMAGE="${IMAGE_PREFIX}/front:${IMAGE_TAG}"

          PROD_ENV="$HOME/enervision/.env"

          test -f "$PROD_ENV"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            config --quiet

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            pull

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            pull ml-predict ml-train

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            up -d --no-build --remove-orphans

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            ps

          echo "Deployed ${IMAGE_TAG}, the newest complete image set of main." >> "$GITHUB_STEP_SUMMARY"

      # The domain served by Caddy comes from the .env file of the VM, the one source the
      # deployment already uses: the verify job needs no setting of its own.
      - name: Read the domain of the site
        id: site
        shell: bash
        run: |
          set -euo pipefail
          domain=$(grep -E '^SITE_DOMAIN=' "$HOME/enervision/.env" | tail -n 1 | cut -d= -f2- | tr -d "\"' \r")
          echo "domain=${domain}" >> "$GITHUB_OUTPUT"

  # Checks the site from a GitHub-hosted runner, that is from the Internet, as a visitor
  # would: the self-hosted runner, on the VM itself, would not see what the NSG lets in.
  verify:
    name: Check the site from the Internet
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      # The check script comes from main, the version of this workflow, not from the deployed
      # commit: a change to deploy/ publishes no image, so the deployed version can predate it.
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: HTTPS, redirect, headers, API behind authentication, closed ports
        env:
          SITE_DOMAIN: ${{ needs.deploy.outputs.site-domain }}
        run: bash deploy/smoke_test.sh
