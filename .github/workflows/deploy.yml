name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that a complete image set was published
        id: image-set
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          missing=()
          published=0

          for service in back ml mlflow; do
            image="${IMAGE_PREFIX}/${service}:${IMAGE_TAG}"
            if inspection=$(docker manifest inspect "$image" 2>&1); then
              published=$((published + 1))
            elif grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$inspection"; then
              missing+=("$service")
            else
              echo "::error::Unable to inspect ${image}: ${inspection}"
              exit 1
            fi
          done

          if (( published == 0 )); then
            # CI publishes images only for a commit that changes something deployable.
            # After a CI run that is expected; a manual run asked for a deployment, so
            # it must not report success when there is nothing to deploy.
            if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
              echo "::error::No images were published for ${IMAGE_TAG}: the latest commit of main changes nothing deployable. Nothing was deployed."
              exit 1
            fi
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deployable images were published for ${IMAGE_TAG}; deployment skipped."
            exit 0
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Incomplete image set for ${IMAGE_TAG}; missing: ${missing[*]}"
            exit 1
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Pull and deploy
        if: steps.image-set.outputs.deploy == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          export BACK_IMAGE="${IMAGE_PREFIX}/back:${IMAGE_TAG}"
          export ML_IMAGE="${IMAGE_PREFIX}/ml:${IMAGE_TAG}"
          export MLFLOW_IMAGE="${IMAGE_PREFIX}/mlflow:${IMAGE_TAG}"

          PROD_ENV="$HOME/enervision/.env"

          test -f "$PROD_ENV"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            config --quiet

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            pull

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            up -d --no-build --remove-orphans

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            --env-file "$PROD_ENV" \
            ps
