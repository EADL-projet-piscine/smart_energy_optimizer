# Deux niveaux de vérification locale, installés ensemble par `pre-commit install` :
# - avant chaque commit : ruff corrige ce qui peut l'être, puis formate ;
# - avant chaque push : mêmes contrôles que le job `lint` de la CI, sans rien modifier.
# Garder la même version que ruff dans les pyproject.toml (dev) pour rester aligné sur la CI.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check (pre-push)
        stages: [pre-push]
      - id: ruff-format
        name: ruff format --check (pre-push)
        args: [--check]
        stages: [pre-push]

  # Utilise l'environnement virtuel activé (Python 3.12, dépendances dev installées).
  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
