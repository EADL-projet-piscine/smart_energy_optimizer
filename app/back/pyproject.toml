[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-app"
version = "0.1.0"
description = "Application métier du Smart Energy Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "argon2-cffi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.17.1",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: nécessite une base PostgreSQL joignable"]

# Read by `pytest --cov` run from app/back, as the tests-back CI job does.
[tool.coverage.run]
source = ["smart_energy_app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
