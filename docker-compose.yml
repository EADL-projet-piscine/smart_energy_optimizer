services:
  db:
    image: postgres:16
    container_name: enervision-db
    environment:
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: enervision
      POSTGRES_DB: enervision
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enervision"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: