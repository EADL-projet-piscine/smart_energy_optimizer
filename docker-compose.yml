services:
  db:
    image: postgres:16
    container_name: enervision-db
    environment:
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: enervision
      POSTGRES_DB: enervision
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enervision"]
      interval: 5s
      timeout: 3s
      retries: 5

  back:
    build: ./app/back
    container_name: enervision-back
    # Facultatif : surcharge locale (identifiants de l API...), absent en CI et sur un clone neuf.
    env_file:
      - path: ./app/back/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://enervision:enervision@db:5432/enervision
      ENERVISION_API_URL: https://api-mock.charlieandre.fr
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    image: smart-energy-ml:dev
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: smart-energy-forecasting
    ports:
      - "8001:8000"
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    build:
      context: ./ml
      dockerfile: Dockerfile.mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

volumes:
  pgdata:
  mlflow_data:
