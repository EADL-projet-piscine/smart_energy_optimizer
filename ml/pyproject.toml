[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-ml"
version = "0.1.0"
description = "Service Machine Learning du Smart Energy Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pandas",
    "numpy",
    "scikit-learn",
    "mlflow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "httpx",
    "ruff==0.17.1",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lu par `pytest --cov` lancé depuis ml/, comme le job tests-ml de la CI.
[tool.coverage.run]
source = ["smart_energy_ml"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"
