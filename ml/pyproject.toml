[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-ml"
version = "0.1.0"
description = "Service Machine Learning du Smart Energy Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pandas",
    "numpy",
    "scikit-learn",
    "mlflow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "httpx",
    "ruff==0.17.1",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
