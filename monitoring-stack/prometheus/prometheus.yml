# Configuration de Prometheus : quoi récolter, et à quelle fréquence
global:
  scrape_interval: 15s # une mesure toutes les 15 secondes

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # L'intérieur de la VM, via node_exporter
  # "node-exporter" est le nom du service dans docker-compose.yml :
  # Docker le transforme automatiquement en adresse sur son réseau interne.
  - job_name: "applicatif-vm"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "applicatif-vm"
