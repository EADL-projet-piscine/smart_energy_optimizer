
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-optimizer"
version = "0.1.0"
description = "Application Smart Energy Optimizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff==0.17.1",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app/back/src", "ml/src"]

[tool.pytest.ini_options]
testpaths = [
    "app/back/tests",
    "ml/tests",
]
pythonpath = [
    "app/back/src",
    "ml/src",
]
markers = [
    "db: nécessite une base PostgreSQL joignable",
]

[tool.coverage.run]
source = ["smart_energy_app", "smart_energy_ml"]

[tool.coverage.report]
# Seuil provisoire, à valider en équipe (ticket #24).
fail_under = 70
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
