# SonarQube configuration shared by the sonar-back, sonar-ml and sonar-front jobs of
# .github/workflows/ci.yml. Each job analyses one component as its own SonarQube project:
# it sets the project key (repository variables SONAR_PROJECT_KEY_BACK, _ML and _FRONT) and
# the organization (SONAR_ORGANIZATION), restricts the analysis with sonar.inclusions and
# gives its own coverage report. The coverage report paths and exclusions below are
# defaults that each job overrides.
sonar.projectName=Smart Energy Optimizer
sonar.sourceEncoding=UTF-8

# Tests live inside the source folders, so they are listed as sources and recognised as
# tests by sonar.test.inclusions. infra is listed but no job includes it: Terraform is
# checked by Trivy (scan job), not by SonarQube.
sonar.sources=app/back/src,app/back/tests,ml/src,ml/tests,app/front/src,infra
sonar.test.inclusions=app/back/tests/**,ml/tests/**,app/front/src/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,infra/.terraform/**

# Coverage reports written by the tests-* jobs. The CI rewrites their paths from the
# project folder to the repository root before the scan.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/back/coverage.xml,ml/coverage.xml
sonar.javascript.lcov.reportPaths=app/front/coverage/lcov.info

# Same scope as the coverage thresholds of app/front/vitest.config.ts, plus empty packages.
sonar.coverage.exclusions=**/__init__.py,app/front/src/main.tsx,app/front/src/App.tsx,app/front/src/vite-env.d.ts,app/front/src/services/model.ts,app/front/src/data/**
