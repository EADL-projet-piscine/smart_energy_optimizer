# Stand-in for the EnerVision API during the CI load test (docker-compose.ci.yml).
# It serves a sample /api/v1/stats/summary response: the back gets consumption data
# without credentials, and the real API never receives load-test traffic.
server {
    listen 80;

    location = /api/v1/stats/summary {
        default_type application/json;
        alias /srv/enervision/summary.json;
    }

    location / {
        return 404;
    }
}
